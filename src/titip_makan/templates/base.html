<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titip Makan MTN CORE{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <span class="text-2xl">🍜</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-800">Titip Makan</h1>
                    <p class="text-xs text-slate-500 font-medium">MTN CORE Internal Order</p>
                </div>
            </a>
            <div class="flex items-center space-x-3 text-sm font-medium">
                <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 text-slate-700 transition">Pesan Makan</a>
                <a href="/coordinator" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition flex items-center gap-1">
                    <span>👑</span> Koordinator
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>Titip Makan MTN CORE &copy; 2026 &bull; Anti-Konflik &amp; Auto-Rekap</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
